# FLASHCORE Independent Production Blueprint Template (INACTIVE — DO NOT AUTO-DEPLOY)
#
# Requires explicit owner approval before provisioning billable resources or applying
# production migrations.
#
# STRICT DUAL-PRODUCTION PROTECTION:
# - Repository: manasaggarwal1107-ctrl/FLASHCORE (branch: main)
# - Independent production API service: flashcore-api
# - Independent production PostgreSQL database: flashcore_production
# - NEVER connect to, migrate, or reuse credentials from legacy academic production
#   (manasaggarwal1107-ctrl/DATABASE-MANAGEMENT-SYSTEM / database-management-system-s1g5.onrender.com /
#   flashcore_postgres_temp) or staging (flashcore-api-staging / flashcore_staging).

databases:
  - name: flashcore-production-db
    databaseName: flashcore_production
    user: flashcore_production
    plan: basic-1gb
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: flashcore-api
    runtime: python
    region: singapore
    plan: standard
    rootDir: backend
    branch: main
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: APP_ENV
        value: production
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_RECYCLE
        value: "1800"
      - key: DB_POOL_PRE_PING
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: flashcore-production-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "30"
      - key: FLASHCORE_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
